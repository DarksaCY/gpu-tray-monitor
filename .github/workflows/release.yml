name: Release

# Сборка GpuTrayMonitor.exe и публикация релиза с ним.
# Запуск: вручную из вкладки Actions с номером версии (тег создаётся автоматически)
# либо пушем тега вида v1.2.3.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия без буквы v, например 1.2.0 (должен быть раздел в CHANGELOG.md)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: |
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /target:winexe /codepage:65001 `
            /out:GpuTrayMonitor.exe /r:System.Windows.Forms.dll /r:System.Drawing.dll GpuTrayMonitor.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ver = $env:VERSION.TrimStart('v')
          $text = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($ver))\s*?\r?\n(.*?)(?=^## |\z)")
          if (-not $m.Success) { throw "В CHANGELOG.md нет раздела '## $ver'" }
          Set-Content notes.md $m.Groups[1].Value.Trim() -Encoding UTF8

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:VERSION.TrimStart('v')
          gh release create "v$ver" GpuTrayMonitor.exe --target $env:GITHUB_SHA --title "GPU Tray Monitor $ver" --notes-file notes.md
